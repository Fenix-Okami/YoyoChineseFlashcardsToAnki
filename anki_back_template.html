<div class="card-content">
  <div id="hanzi-ruby" lang="zh-Hans" class="hanzi hanzi-ruby"></div>
  <div class="english english-back">{{english}}</div>

  <div class="buttons-row">
    {{#audio}}{{audio}}{{/audio}}
  </div>
</div>

<script>
  (function () {
    var target = document.getElementById('hanzi-ruby');
    if (!target) return;

    var hanzi = "{{simplified}}";
    var pinyin = "{{pinyin}}";

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/\'/g, '&#39;');
    }

    function isHanziChar(ch) {
      return /[\u3400-\u9FFF]/.test(ch);
    }

    // Split pinyin into syllables; drop common separators.
    var syllables = pinyin
      .replace(/\s+/g, ' ')
      .trim()
      .split(' ')
      .filter(function (t) { return t && t !== '/' && t !== '／' && t !== '-'; });

    var si = 0;
    var out = '';
    for (var i = 0; i < hanzi.length; i++) {
      var ch = hanzi[i];
      if (isHanziChar(ch)) {
        var syl = (si < syllables.length) ? syllables[si++] : '';
        out += '<ruby><rb>' + escapeHtml(ch) + '</rb><rt>' + escapeHtml(syl) + '</rt></ruby>';
      } else {
        out += escapeHtml(ch);
      }
    }

    target.innerHTML = out || escapeHtml(hanzi);
  })();
</script>
